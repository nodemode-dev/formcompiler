# Weekly, one grouped pull request per ecosystem, and a new release must be 7 days old before it is proposed, so a
# hijacked release is usually found and pulled before it reaches the signing jobs. Security updates are not held back.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: pip
    directories: ["/scripts", "/tests"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
