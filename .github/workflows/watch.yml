name: watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      app:
        description: "Only this app (empty: every app in apps/)"
        type: string
        default: ""
      dry-run:
        description: "Report what would start, start nothing"
        type: boolean
        default: false
      again:
        description: "Again: start this app's release once more, though an earlier run of the same commit failed, was cancelled or was deleted"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    # Only here, never in a fork: forks copy the workflows but not the secrets, environment or variables.
    if: github.repository == 'nodemode-dev/formcompiler'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Registry
        run: python3 -I scripts/registry.py check
      - name: The record of every release run the watch has seen or started
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watch/record.json
          key: watch-record-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: watch-record-
      - id: watch
        name: Find compile branches and version tags and start their releases
        env:
          GH_TOKEN: ${{ github.token }}
          FORMCOMPILER_APP_TOKEN: ${{ secrets.FORMCOMPILER_APP_TOKEN }}
          APP: ${{ inputs.app }}
          DRY_RUN: ${{ inputs.dry-run }}
          AGAIN: ${{ inputs.again }}
        run: |
          args=(--ref "$GITHUB_REF_NAME" --record .watch/record.json)
          if [ -n "$APP" ]; then args+=(--app "$APP"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$AGAIN" ]; then args+=(--again "$AGAIN"); fi
          python3 -I scripts/watch.py "${args[@]}"
      - name: Keep the record when it changed
        if: ${{ always() && steps.watch.outputs.record == 'changed' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watch/record.json
          key: watch-record-${{ github.run_id }}-${{ github.run_attempt }}
