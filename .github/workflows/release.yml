name: release

run-name: ${{ inputs.app }} ${{ inputs.version }} at ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Registry name of the app (apps/<app>.json), e.g. formvis"
        type: string
        required: true
      ref:
        description: "The compile branch (compile_vX.Y.Z), the version tag (vX.Y.Z, when the registry sets tag_trigger) or the full commit SHA either points at"
        type: string
        required: true
      version:
        description: "The version the branch or tag names (optional for a branch or tag name)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    # Only here, never in a fork: forks copy the workflows but not the secrets, environment or variables.
    if: github.repository == 'nodemode-dev/formcompiler'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      branch: ${{ steps.gate.outputs.branch }}
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
      config: ${{ steps.registry.outputs.config }}
      extras: ${{ steps.registry.outputs.extras }}
      image: ${{ steps.registry.outputs.image }}
      assets: ${{ steps.registry.outputs.assets }}
      notes: ${{ steps.registry.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: registry
        env:
          APP: ${{ inputs.app }}
        run: python3 -I scripts/registry.py config --app "$APP" > /dev/null
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORMCOMPILER_APP_TOKEN: ${{ secrets.FORMCOMPILER_APP_TOKEN }}
          APP: ${{ inputs.app }}
          REF: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.app }} ${{ inputs.version }} at ${{ inputs.ref }}
        run: python3 -I scripts/gate.py --app "$APP" --ref "$REF" --version "$VERSION" --run-title "$TITLE"

  desktop:
    name: desktop
    needs: gate
    if: fromJSON(needs.gate.outputs.config).has_desktop
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-release.yml
    with:
      app-name: ${{ inputs.app }}
      repository: ${{ fromJSON(needs.gate.outputs.config).repository }}
      ref: ${{ needs.gate.outputs.sha }}
      expect-version: ${{ needs.gate.outputs.version }}
      app-title: ${{ fromJSON(needs.gate.outputs.config).title }}
      cli: ${{ fromJSON(needs.gate.outputs.config).cli }}
      version-file: ${{ fromJSON(needs.gate.outputs.config).version_file }}
      version-pattern: ${{ fromJSON(needs.gate.outputs.config).version_pattern }}
      platforms: ${{ fromJSON(needs.gate.outputs.config).platforms }}
      platform-env: ${{ fromJSON(needs.gate.outputs.config).platform_env }}
      install: ${{ fromJSON(needs.gate.outputs.config).install }}
      install-args: ${{ fromJSON(needs.gate.outputs.config).install_args }}
      install-desktop: ${{ fromJSON(needs.gate.outputs.config).install_desktop }}
      windows-shell: ${{ fromJSON(needs.gate.outputs.config).windows_shell }}
      build-macos: ${{ fromJSON(needs.gate.outputs.config).build_macos }}
      build-linux: ${{ fromJSON(needs.gate.outputs.config).build_linux }}
      build-windows: ${{ fromJSON(needs.gate.outputs.config).build_windows }}
      post-build-macos: ${{ fromJSON(needs.gate.outputs.config).post_build_macos }}
      post-build-linux: ${{ fromJSON(needs.gate.outputs.config).post_build_linux }}
      post-build-windows: ${{ fromJSON(needs.gate.outputs.config).post_build_windows }}
      tauri-config: ${{ fromJSON(needs.gate.outputs.config).tauri_config }}
      artifacts: ${{ fromJSON(needs.gate.outputs.config).artifacts }}
      setup-macos: ${{ fromJSON(needs.gate.outputs.config).setup_macos }}
      setup-linux: ${{ fromJSON(needs.gate.outputs.config).setup_linux }}
      setup-windows: ${{ fromJSON(needs.gate.outputs.config).setup_windows }}
      linux-packages: ${{ fromJSON(needs.gate.outputs.config).linux_packages }}
      node-version: ${{ fromJSON(needs.gate.outputs.config).node }}
      python-version: ${{ fromJSON(needs.gate.outputs.config).python }}
      go-version: ${{ fromJSON(needs.gate.outputs.config).go }}
      rust-targets: ${{ fromJSON(needs.gate.outputs.config).rust_targets }}
      rust-cache-workspaces: ${{ fromJSON(needs.gate.outputs.config).rust_cache }}
      windows-msvc: ${{ fromJSON(needs.gate.outputs.config).windows_msvc }}
      pip-cache-macos: ${{ fromJSON(needs.gate.outputs.config).pip_cache_macos }}
      updater-tauri: ${{ fromJSON(needs.gate.outputs.config).updater_tauri }}
      macos-signing: ${{ fromJSON(needs.gate.outputs.config).macos_signing }}
      windows-signing: ${{ fromJSON(needs.gate.outputs.config).windows_signing }}
      file-names: ${{ fromJSON(needs.gate.outputs.config).file_names }}
      formcompiler-ref: ${{ github.sha }}
    secrets: inherit

  extras:
    name: extra ${{ matrix.name }}
    needs: gate
    if: fromJSON(needs.gate.outputs.config).has_extras
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 49
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.extras) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(needs.gate.outputs.config).repository }}
          ref: ${{ needs.gate.outputs.sha }}
          token: ${{ secrets.FORMCOMPILER_APP_TOKEN || github.token }}
          persist-credentials: false
      - if: matrix.node != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.python != ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.java != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - if: matrix.android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - if: matrix.go != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
      - if: matrix.rust || matrix.rust_targets != ''
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}
      - name: Linux packages
        if: runner.os == 'Linux' && matrix.linux_packages != ''
        env:
          PACKAGES: ${{ matrix.linux_packages }}
        run: |
          case "$PACKAGES" in *[!a-z0-9.+:\ -]*) echo "::error::linux_packages may hold only package names"; exit 1 ;; esac
          sudo apt-get update
          read -r -a list <<< "$PACKAGES"
          sudo apt-get install -y --no-install-recommends "${list[@]}"
      - name: Run
        env:
          FORMCOMPILER_VERSION: ${{ needs.gate.outputs.version }}
          RUN: ${{ matrix.run }}
        run: bash -eo pipefail -c "$RUN"
      - name: Collect
        env:
          ARTIFACTS: ${{ matrix.artifacts }}
        run: |
          mkdir -p formcompiler-out
          found=0
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            while IFS= read -r file; do
              [ -f "$file" ] || continue
              cp "$file" formcompiler-out/
              echo "collected $file"
              found=1
            done < <(python3 -c 'import glob, sys; print("\n".join(sorted(glob.glob(sys.argv[1], recursive=True))))' "$pattern")
          done <<< "$ARTIFACTS"
          [ "$found" = 1 ] || { echo "::error::no file matched the extra's artifacts"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formcompiler-${{ inputs.app }}-extra-${{ matrix.name }}
          path: formcompiler-out/*
          if-no-files-found: error

  image:
    name: container image
    needs: gate
    if: fromJSON(needs.gate.outputs.config).has_image
    runs-on: ubuntu-24.04
    timeout-minutes: 49
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(needs.gate.outputs.config).repository }}
          ref: ${{ needs.gate.outputs.sha }}
          token: ${{ secrets.FORMCOMPILER_APP_TOKEN || github.token }}
          persist-credentials: false
      - id: spec
        env:
          IMAGE: ${{ needs.gate.outputs.image }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          image = json.loads(os.environ["IMAGE"])
          version = os.environ["VERSION"]
          fill = lambda text: text.replace("{version}", version).replace("{tag}", f"v{version}")
          tags = "\n".join(f"{image['name']}:{fill(t)}" for t in image["tags"])
          args = "\n".join(f"{k}={fill(v)}" for k, v in image.get("build_args", {}).items())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for key, value in (("tags", tags), ("args", args), ("context", image["context"]), ("file", image["file"]), ("platforms", image["platforms"])):
                  out.write(f"{key}<<FORMCOMPILER_EOF\n{value}\nFORMCOMPILER_EOF\n")
          PY
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.spec.outputs.context }}
          file: ${{ steps.spec.outputs.file }}
          platforms: ${{ steps.spec.outputs.platforms }}
          build-args: ${{ steps.spec.outputs.args }}
          tags: ${{ steps.spec.outputs.tags }}
          push: true

  assemble:
    name: draft release
    needs: [gate, desktop, extras, image]
    if: >-
      always() && needs.gate.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.desktop.result)
      && contains(fromJSON('["success","skipped"]'), needs.extras.result)
      && contains(fromJSON('["success","skipped"]'), needs.image.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - name: Release credential
        id: credential
        env:
          REPOSITORY: ${{ fromJSON(needs.gate.outputs.config).repository }}
          HAS_APP: ${{ secrets.FORMCOMPILER_APP_ID != '' && secrets.FORMCOMPILER_APP_PRIVATE_KEY != '' }}
          HAS_TOKEN: ${{ secrets.FORMCOMPILER_WRITE_TOKEN != '' }}
        run: |
          echo "name=${REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          if [ "$HAS_APP" = "true" ]; then
            echo "shape=app" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_TOKEN" = "true" ]; then
            echo "shape=token" >> "$GITHUB_OUTPUT"
          else
            echo "::error::no credential can write releases on $REPOSITORY: set FORMCOMPILER_APP_ID and FORMCOMPILER_APP_PRIVATE_KEY (a GitHub App) or FORMCOMPILER_WRITE_TOKEN in the release environment; see docs/ACCOUNTS.md"
            exit 1
          fi
      - name: App token for the app repository
        id: app-token
        if: steps.credential.outputs.shape == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.FORMCOMPILER_APP_ID }}
          private-key: ${{ secrets.FORMCOMPILER_APP_PRIVATE_KEY }}
          owner: nodemode-dev
          repositories: ${{ steps.credential.outputs.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(needs.gate.outputs.config).repository }}
          ref: ${{ needs.gate.outputs.sha }}
          token: ${{ secrets.FORMCOMPILER_APP_TOKEN || github.token }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: formcompiler-${{ inputs.app }}-*
          path: dist
          merge-multiple: true
      - name: App release assets
        if: fromJSON(needs.gate.outputs.config).has_assets
        working-directory: app
        env:
          ASSETS: ${{ needs.gate.outputs.assets }}
          FORMCOMPILER_VERSION: ${{ needs.gate.outputs.version }}
          FORMCOMPILER_TAG: ${{ needs.gate.outputs.tag }}
        run: DIST="$GITHUB_WORKSPACE/dist" bash -eo pipefail -c "$ASSETS"
      - name: App manifest and skills
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ needs.gate.outputs.version }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          python3 -I scripts/agents.py build --app "$APP" --app-dir app --dist dist --version "$VERSION" --commit "$SHA"
          python3 -I scripts/agents.py check --app "$APP" --dist dist
      - name: App plus FormPortal
        if: fromJSON(needs.gate.outputs.config).with_portal
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: python3 -I scripts/with_portal.py --app "$APP" --dir dist --version "$VERSION"
      - name: Checksums and updater feed
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          TAG: ${{ needs.gate.outputs.tag }}
          TITLE: ${{ fromJSON(needs.gate.outputs.config).title }}
          REPO: ${{ fromJSON(needs.gate.outputs.config).repository }}
        run: >-
          python3 -I scripts/release_assets.py --dir=dist --version="$VERSION"
          --tag="$TAG" --repo="$REPO" --title="$TITLE"
      - name: Release notes
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SOURCE: ${{ fromJSON(needs.gate.outputs.config).repository }}
          SHA: ${{ needs.gate.outputs.sha }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          NOTES: ${{ needs.gate.outputs.notes }}
        run: >-
          python3 -I scripts/notes.py --app-dir=app --version="$VERSION" --repo="$SOURCE"
          --sha="$SHA" --branch="$BRANCH" --command="$NOTES" --out="$RUNNER_TEMP/release-notes.md"
      - name: Create or refresh the draft on the app repository
        working-directory: dist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.FORMCOMPILER_WRITE_TOKEN }}
          GH_REPO: ${{ fromJSON(needs.gate.outputs.config).repository }}
          TAG: ${{ needs.gate.outputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
          VERSION: ${{ needs.gate.outputs.version }}
          TITLE: ${{ fromJSON(needs.gate.outputs.config).title }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
        run: |
          name="$TITLE $VERSION"
          notes="$RUNNER_TEMP/release-notes.md"
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::$GH_REPO already has a published release $TAG; bump the version to release again"
              exit 1
            fi
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release edit "$TAG" --draft --title "$name" --target "$SHA" --prerelease="$PRERELEASE" --notes-file "$notes"
            gh release upload "$TAG" --clobber -- *
          else
            pre=()
            if [ "$PRERELEASE" = "true" ]; then pre=(--prerelease); fi
            gh release create "$TAG" --draft --title "$name" --target "$SHA" --notes-file "$notes" --latest=false "${pre[@]}" -- *
          fi
          { echo "Draft **$name** (\`$TAG\` on $GH_REPO)"; echo; sed 's/^/    /' SHA256SUMS.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: Supersede older drafts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.FORMCOMPILER_WRITE_TOKEN }}
          GH_REPO: ${{ fromJSON(needs.gate.outputs.config).repository }}
          APP: ${{ inputs.app }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          python3 -I scripts/versions.py older-drafts --app "$APP" --version "$VERSION" --repo "$GH_REPO" > "$RUNNER_TEMP/older-drafts.txt"
          while IFS= read -r old; do
            [ -n "$old" ] || continue
            gh release delete "$old" --yes
            echo "- superseded and deleted the draft \`$old\` on $GH_REPO" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/older-drafts.txt"
      - name: Publish (a beta, or registry release is publish)
        if: needs.gate.outputs.prerelease == 'true' || fromJSON(needs.gate.outputs.config).release == 'publish'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.FORMCOMPILER_WRITE_TOKEN }}
          GH_REPO: ${{ fromJSON(needs.gate.outputs.config).repository }}
          APP: ${{ inputs.app }}
          TAG: ${{ needs.gate.outputs.tag }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          DISPATCH_TOKEN: ${{ secrets.FORMPIPE_DISPATCH_TOKEN }}
        run: |
          gh release edit "$TAG" --draft=false --latest=false --prerelease="$PRERELEASE"
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::notice::Published $TAG on $GH_REPO. FORMPIPE_DISPATCH_TOKEN is not set, so the publishing pipeline was not told; its hourly run picks the release up"
            echo "Published \`$TAG\` on $GH_REPO; the publishing pipeline's hourly run picks it up" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if python3 -I -c 'import json, sys; print(json.dumps({"event_type": "formcompiler-published", "client_payload": {"app": sys.argv[1], "tag": sys.argv[2], "repository": sys.argv[3]}}))' "$APP" "$TAG" "$GH_REPO" \
            | GH_TOKEN="$DISPATCH_TOKEN" gh api -X POST repos/nodemode-dev/formpipe/dispatches --input -; then
            echo "Published \`$TAG\` on $GH_REPO and sent formcompiler-published to the publishing pipeline" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Published $TAG on $GH_REPO, but the dispatch to the publishing pipeline failed (is FORMPIPE_DISPATCH_TOKEN expired?); its hourly run picks the release up"
            echo "Published \`$TAG\` on $GH_REPO; the dispatch failed, the publishing pipeline's hourly run picks it up" >> "$GITHUB_STEP_SUMMARY"
          fi
